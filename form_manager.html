<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Správce formulářů</title>
  <style>
    :root {
      --b:#1d1d1f; --mut:#6e6e73; --br:#e5e5e7; --bg:#f5f5f7; --p:#0a84ff;
      --card: rgba(255,255,255,0.72); --card-border: rgba(0,0,0,0.06);
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --ring: 0 0 0 3px rgba(10,132,255,0.25);
      --form-bg: #f7fbff; /* very light blue, nearly white */
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--b); background: linear-gradient(180deg,#fafafc 0%, #f5f5f7 60%, #f0f0f3 100%); margin: 0; }
    /* Hero header */
    header.hero-section { background: linear-gradient(135deg, #0a84ff 0%, #005ac6 100%); color:#fff; padding: 28px 24px; display:flex; align-items:center; justify-content:space-between; position: sticky; top:0; z-index: 10; }
    header.hero-section h1 { font-size: 24px; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
    .menu-btn { background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.28); padding:10px 16px; border-radius:999px; text-decoration:none; font-size:14px; backdrop-filter: blur(12px); transition: all .2s ease; }
    .menu-btn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
    /* Layout */
    .main-container { background: transparent; margin: 24px; }
    main { display:grid; grid-template-columns: 1fr; gap: 24px; padding: 0; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card); backdrop-filter: saturate(180%) blur(20px); border: 1px solid var(--card-border); border-radius:18px; box-shadow: var(--shadow); overflow: hidden; }
    .card h3 { margin:0; padding:18px 20px; border-bottom:1px solid var(--br); font-size:17px; font-weight: 600; }
    .card .content { padding:18px 20px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    select, input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"], textarea { width:100%; padding:12px 14px; border:1px solid var(--br); border-radius:12px; font-size:14px; background:#fff; transition: box-shadow .15s ease, border-color .15s ease; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: #0a84ff; box-shadow: var(--ring); }
    textarea { min-height:96px; resize: vertical; }
    label { font-size:13px; color: var(--mut); display:block; margin-bottom:6px; }
    .btn { background: var(--p); color:#fff; border:none; border-radius:999px; padding:10px 16px; cursor:pointer; font-size:14px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(10,132,255,0.25); }
    .btn:focus { outline: none; box-shadow: var(--ring); }
    .btn.secondary { background:#fff; color:var(--b); border:1px solid var(--br); }
    .btn.secondary:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .btn.danger { background:#d72638; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; }
    .muted { color: var(--mut); font-size:12px; }
    .fields { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: end; }
    .field { display:grid; gap:8px; min-width: 0; }
    .field label { overflow-wrap: anywhere; font-weight: 600; color: #1d1d1f; letter-spacing: -0.01em; }
    /* Prevent overflow in grid children */
    input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"], select, textarea { min-width: 0; box-sizing: border-box; }
    .entry { border:1px solid rgba(0,0,0,0.06); padding:14px; border-radius:14px; background:#fff; }
    /* Tiles grid */
    #formsList { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:18px; }
    .saved-checklist { background: var(--card); backdrop-filter: saturate(180%) blur(20px); border: 1px solid var(--card-border); border-radius: 18px; padding: 20px; transition: all .25s cubic-bezier(.25,.46,.45,.94); cursor: pointer; box-shadow: var(--shadow); }
    .saved-checklist:hover { background: rgba(255,255,255,0.9); transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.12); }
    .checklist-title { font-size: 18px; font-weight: 700; color: #1d1d1f; margin-bottom: 6px; letter-spacing: -0.01em; }
    .checklist-description { font-size: 15px; color: #86868b; margin-bottom: 8px; }
    .checklist-meta { display:flex; justify-content:space-between; align-items:center; margin-top: 12px; font-size: 13px; color:#86868b; }
    .actions { justify-content: flex-end; margin-top: 12px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 0; }
    .modal { background: #ffffff; border:1px solid var(--br); border-radius:18px; width: min(1040px, 96vw); height: min(88vh, 980px); display:flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.25); }
    .modal header { display:flex; align-items:center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--br); background: #fff; position: sticky; top: 0; z-index: 1; }
    .modal header h3 { margin:0; font-size:17px; font-weight: 600; }
    .modal .modal-body { padding: 18px 18px; overflow: auto; flex: 1; background: var(--form-bg); font-size: 15px; line-height: 1.5; }
    .sticky-actions { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--br); padding: 12px 0; margin-top: 12px; }
    .section-title { font-size: 17px; font-weight: 700; margin: 12px 0 8px; color: #1d1d1f; grid-column: 1 / -1; padding-top: 6px; border-top: 1px solid var(--br); }
    .close-btn { background:#fff; color:var(--b); border:1px solid var(--br); border-radius:999px; padding:8px 12px; cursor:pointer; transition: box-shadow .15s ease, transform .15s ease; }
    .close-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .toast { position: fixed; top: 16px; right: 16px; background: #1d1d1f; color:#fff; padding:10px 12px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); opacity: 0; transform: translateY(-8px); transition: opacity .2s ease, transform .2s ease; z-index: 2000; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .hint { font-size: 12px; color: var(--mut); margin-top: -2px; }

    @media (max-width: 860px){
      .main-container { margin: 16px; }
      .card .content { padding:16px; }
      #formsList { grid-template-columns: 1fr; }
    }

    /* Force full stacking and ignore spans on very small screens */
    @media (max-width: 640px){
      .fields { grid-template-columns: 1fr !important; }
      .fields > .field { grid-column: 1 / -1 !important; }
      .section-title { grid-column: 1 / -1 !important; }
    }

    /* Print styles */
    @media print {
      body { background: #fff; }
      header.hero-section, .main-container > main > section.card:first-child { display: none !important; }
      .modal-overlay { position: static; display: block !important; background: #fff !important; backdrop-filter: none !important; padding: 0; }
      .modal { width: 100% !important; height: auto !important; border: none; border-radius: 0; box-shadow: none; }
      .modal .modal-body { background: #fff; overflow: visible; }
      .sticky-actions, .close-btn { display:none !important; }
      /* ensure natural flow for printed content */
      form.fields { display: block !important; }
      .field { break-inside: avoid; page-break-inside: avoid; }
      .doc p { margin: 0 0 8px; line-height: 1.45; orphans: 3; widows: 3; }
      .doc h1, .doc h2, .doc h3 { margin: 12px 0 8px; break-after: avoid; page-break-after: avoid; }
      input, textarea, select { border: none !important; box-shadow: none !important; background: transparent !important; }
    }

    /* PDF pagination helpers */
    .page-break { break-before: page; page-break-before: always; }
    .avoid-break { break-inside: avoid; page-break-inside: avoid; }
    .modal .modal-body h1, .modal .modal-body h2, .modal .modal-body h3, .modal .modal-body h4, .section-title { break-after: avoid; page-break-after: avoid; }
  </style>
</head>
<body>
  <header class="hero-section">
    <h1>Správce formulářů</h1>
    <div class="toolbar">
      <a class="menu-btn" href="index.html">← Hlavní menu</a>
      <button class="btn" onclick="window.location.href='form_editor.html'">Otevřít editor</button>
      <button class="btn secondary" onclick="exportAll()">Exportovat vše (JSON)</button>
      <label class="btn secondary" for="importFile" style="display:inline-block;">Importovat</label>
      <input id="importFile" type="file" accept="application/json" style="display:none" onchange="handleImport(event)">
    </div>
  </header>

  <div class="main-container">
  <main>
    <section class="card">
      <h3>Dostupné formuláře</h3>
      <div class="content">
        <div class="row" style="margin-bottom:8px;">
          <select id="formSelect"></select>
          <button class="btn" onclick="loadSelectedForm()">Načíst</button>
        </div>
        <div id="formsList"></div>
      </div>
    </section>

    <!-- Modal for opening forms -->
    <div id="formModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal">
        <header>
          <h3 id="modalTitle">Formulář</h3>
          <button class="close-btn" onclick="closeModal()">Zavřít</button>
        </header>
        <div class="modal-body">
          <p class="muted" id="modalDesc"></p>
          <form id="modalDynamicForm" class="fields"></form>
          <div class="sticky-actions">
            <div class="row">
              <button class="btn" type="button" onclick="saveCurrentEntry()">Uložit jako preset</button>
              <button class="btn secondary" type="button" onclick="resetForm()">Vymazat</button>
              <button class="btn secondary" type="button" onclick="printForm()">Tisk</button>
              <button class="btn secondary" type="button" onclick="exportPDF()">Stáhnout PDF</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  </div>

  <script src="forms_storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
  <!-- pdfmake for precise text-based PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.9/build/pdfmake.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.9/build/vfs_fonts.js"></script>
  <script>
    let currentSchemaId = null;
    let currentSchema = null;
    const signaturePads = {}; // id -> SignaturePad instance

    function syncSignaturesToHidden(){
      // Ensure hidden inputs contain latest signature images
      Object.keys(signaturePads).forEach(id => {
        const pad = signaturePads[id];
        const hidden = document.getElementById('f_' + id);
        if (!hidden || !pad) return;
        if (!pad.isEmpty()) hidden.value = pad.toDataURL('image/png');
      });
    }

    function renderFormsList(){
      const list = document.getElementById('formsList');
      const select = document.getElementById('formSelect');
      list.innerHTML = '';
      select.innerHTML = '';
      const schemas = FormsStore.listSchemas();
      schemas.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id; opt.textContent = s.name;
        select.appendChild(opt);

        const tile = document.createElement('div');
        tile.className = 'saved-checklist';
        tile.onclick = () => openForm(s.id);
        const fieldsCount = Array.isArray(s.fields) ? s.fields.length : 0;
        const dateStr = new Date(s.updatedAt || s.createdAt || Date.now()).toLocaleDateString('cs-CZ');
        tile.innerHTML = `
          <div class="checklist-title">${s.name}</div>
          <div class="checklist-description">${s.description || ''}</div>
          <div class="checklist-meta">
            <span>${fieldsCount} polí</span>
            <span>${dateStr}</span>
          </div>
          <div class="row actions">
            <button class='btn secondary' onclick="event.stopPropagation(); openForm('${s.id}')">Otevřít</button>
            <button class='btn danger' onclick="event.stopPropagation(); deleteSchema('${s.id}')">Smazat</button>
          </div>`;
        list.appendChild(tile);
      });
    }

    function loadSelectedForm(){
      const id = document.getElementById('formSelect').value;
      if (id) openForm(id);
    }

    function openForm(id){
      const schema = FormsStore.getSchema(id);
      if (!schema){ alert('Formulář nenalezen'); return; }
      currentSchemaId = id;
      currentSchema = schema;
      document.getElementById('modalTitle').textContent = schema.name || 'Formulář';
      document.getElementById('modalDesc').textContent = schema.description || '';
      renderDynamicForm(schema, 'modalDynamicForm');
      openModal();
    }

    function renderDynamicForm(schema, targetId){
      const form = document.getElementById(targetId || 'modalDynamicForm');
      form.innerHTML = '';
      (schema.fields || []).forEach(f => {
        if (f.type === 'section'){
          const h = document.createElement('div');
          h.className = 'section-title';
          if (Number.isInteger(f.span) && f.span > 0) { h.style.gridColumn = `span ${f.span}`; }
          h.textContent = f.label || f.name || '';
          form.appendChild(h);
          return;
        }
        if (f.type === 'signature'){
          const id = 'f_' + f.id;
          const wrap = document.createElement('div');
          wrap.className = 'field';
          if (f.span) wrap.style.gridColumn = `span ${f.span}`;
          const label = document.createElement('label');
          label.textContent = f.label || 'Podpis';
          wrap.appendChild(label);
          const canvas = document.createElement('canvas');
          canvas.style.width = '100%';
          canvas.style.height = '160px';
          canvas.style.border = '1px solid var(--br)';
          canvas.style.borderRadius = '8px';
          canvas.style.background = '#fff';
          canvas.className = 'signature-pad';
          canvas.setAttribute('data-signature-id', f.id);
          wrap.appendChild(canvas);
          const ctrls = document.createElement('div');
          ctrls.className = 'row';
          ctrls.style.marginTop = '6px';
          const clearBtn = document.createElement('button');
          clearBtn.type = 'button';
          clearBtn.className = 'btn secondary';
          clearBtn.textContent = 'Vymazat podpis';
          ctrls.appendChild(clearBtn);
          wrap.appendChild(ctrls);
          const hidden = document.createElement('input');
          hidden.type = 'hidden';
          hidden.id = id;
          wrap.appendChild(hidden);
          form.appendChild(wrap);

          // init signature pad after canvas is in DOM
          const dpr = Math.max(window.devicePixelRatio || 1, 1);
          const resizeCanvas = () => {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = 160 * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
          };
          resizeCanvas();
          const pad = new (window.SignaturePad || SignaturePad)(canvas, { penColor: '#0a84ff', backgroundColor: 'rgba(255,255,255,1)' });
          signaturePads[f.id] = pad;
          clearBtn.addEventListener('click', ()=>{ pad.clear(); hidden.value = ''; });
          canvas.addEventListener('mouseup', ()=>{ if (!pad.isEmpty()) hidden.value = pad.toDataURL('image/png'); });
          canvas.addEventListener('touchend', ()=>{ if (!pad.isEmpty()) hidden.value = pad.toDataURL('image/png'); });
          window.addEventListener('resize', ()=>{ const data = pad.toData(); resizeCanvas(); pad.fromData(data); });
          return;
        }
        if (f.type === 'html'){
          const block = document.createElement('div');
          block.className = 'field';
          // Allow spanning multiple columns / full width
          if (Number.isInteger(f.span) && f.span > 0) { block.style.gridColumn = `span ${f.span}`; }
          // Inject provided HTML (assumed trusted from local schema)
          block.innerHTML = f.html || '';
          form.appendChild(block);
          return;
        }
        const wrap = document.createElement('div');
        wrap.className = 'field';
        // Optional: allow fields to span multiple grid columns if schema provides f.span
        if (Number.isInteger(f.span) && f.span > 0) {
          wrap.style.gridColumn = `span ${f.span}`;
        }
        const id = 'f_' + f.id;
        const label = document.createElement('label');
        label.setAttribute('for', id);
        label.textContent = f.label || f.name || 'Pole';
        wrap.appendChild(label);

        let input;
        switch(f.type){
          case 'textarea':
            input = document.createElement('textarea');
            break;
          case 'number':
            input = document.createElement('input');
            input.type = 'number';
            break;
          case 'select':
            input = document.createElement('select');
            (f.options || []).forEach(opt => {
              const o = document.createElement('option');
              o.value = opt.value ?? opt; o.textContent = opt.label ?? opt;
              input.appendChild(o);
            });
            break;
          case 'checkbox':
            input = document.createElement('input');
            input.type = 'checkbox';
            break;
          case 'date':
            input = document.createElement('input');
            input.type = 'date';
            break;
          case 'datetime':
            input = document.createElement('input');
            input.type = 'datetime-local';
            break;
          default:
            input = document.createElement('input');
            input.type = 'text';
        }
        input.id = id;
        if (f.required) input.required = true;
        form.appendChild(wrap);
        wrap.appendChild(input);
        // Generic auto-fill for select using schema-provided onChangeFill mapping
        if (f.type === 'select' && f.onChangeFill && typeof f.onChangeFill === 'object'){
          const applyFill = (val) => {
            const mapping = f.onChangeFill[val];
            if (!mapping) return;
            Object.keys(mapping).forEach(targetId => {
              const v = mapping[targetId] ?? '';
              // explicit field
              const tgt = document.getElementById('f_' + targetId);
              if (tgt) { tgt.value = v; }
              // inline inputs inside HTML blocks
              const formEl = document.getElementById('modalDynamicForm');
              formEl.querySelectorAll(`[data-field="${targetId}"]`).forEach(el => {
                if (el.tagName === 'SELECT'){
                  // try to set matching option by value or text
                  const opt = Array.from(el.options).find(o => o.value === v || o.text === v);
                  el.value = opt ? opt.value : v;
                } else if (el.type === 'checkbox') {
                  el.checked = !!v;
                } else {
                  el.value = v;
                }
              });
            });
          };
          input.addEventListener('change', () => applyFill(input.value));
        }
        if (f.hint) {
          const h = document.createElement('div');
          h.className = 'hint';
          h.textContent = f.hint;
          wrap.appendChild(h);
        }
      });
    }

    function collectFormData(){
      const data = {};
      (currentSchema.fields || []).forEach(f => {
        if (f.type === 'section') return; // non-input
        if (f.type === 'html') return; // inline inputs handled below
        const id = 'f_' + f.id;
        const el = document.getElementById(id);
        if (!el) return;
        if (f.type === 'checkbox') data[f.id] = !!el.checked;
        else data[f.id] = el.value;
      });
      // Collect inline inputs embedded in HTML blocks using data-field attributes
      const formEl = document.getElementById('modalDynamicForm');
      formEl.querySelectorAll('[data-field]').forEach(el => {
        const key = el.getAttribute('data-field');
        if (!key) return;
        // If there is already a value from an explicit field, only replace it if it's empty and inline has something
        if (data[key] !== undefined) {
          const inlineVal = (el.type === 'checkbox') ? (!!el.checked) : (el.value || '');
          const hasInline = (el.type === 'checkbox') ? el.checked : (inlineVal !== '');
          const hasExplicit = (typeof data[key] === 'boolean') ? data[key] : (data[key] !== '');
          if (!hasExplicit && hasInline) data[key] = inlineVal;
          return;
        }
        if (el.type === 'checkbox') data[key] = !!el.checked;
        else data[key] = el.value;
      });
      return data;
    }

    function saveCurrentEntry(){
      if (!currentSchema) return;
      const data = collectFormData();
      const title = getPresetTitle(data, currentSchema);
      data._presetTitle = title;
      FormsStore.saveEntry(currentSchemaId, data);
      showToast(`Preset uložen: ${title}`);
      closeModal();
    }

    // Entries list/UI intentionally removed: saving goes silently to storage as presets.

    function resetForm(){
      if (!currentSchema) return;
      renderDynamicForm(currentSchema, 'modalDynamicForm');
    }

    function openModal(){
      const ovl = document.getElementById('formModal');
      ovl.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal(){
      const ovl = document.getElementById('formModal');
      ovl.style.display = 'none';
      document.body.style.overflow = '';
    }

    // Close on overlay click
    document.addEventListener('click', (e)=>{
      const ovl = document.getElementById('formModal');
      if (ovl.style.display !== 'flex') return;
      if (e.target === ovl) closeModal();
    });

    // Close on Escape key
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape') closeModal();
    });

    function deleteSchema(id){
      if (!confirm('Smazat formulář včetně odpovědí?')) return;
      FormsStore.deleteSchema(id);
      if (currentSchema && currentSchema.id === id){
        closeModal();
        currentSchema = null;
      }
      renderFormsList();
    }

    function exportAll(){
      FormsStore.download('forms_export.json', FormsStore.exportAll());
    }

    function makePlainClone(){
  const modalBody = document.querySelector('#formModal .modal .modal-body');
  if (!modalBody) return null;
  const clone = modalBody.cloneNode(true);
  // 1) Signatures: replace canvas with image using hidden value (dataURL)
  clone.querySelectorAll('canvas.signature-pad').forEach(cv => {
    const sigId = cv.getAttribute('data-signature-id');
    let dataUrl = '';
    // find matching hidden input inside clone
    if (sigId) {
      const hidden = clone.querySelector(`#f_${sigId}`);
      if (hidden && hidden.value) dataUrl = hidden.value;
      // also mark hidden to be removed later
      if (hidden) hidden.setAttribute('data-remove', 'true');
    }
    if (dataUrl) {
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Podpis';
      img.style.display = 'block';
      img.style.width = '100%';
      img.style.maxHeight = '160px';
      img.style.objectFit = 'contain';
      img.style.border = '1px solid var(--br)';
      img.style.borderRadius = '8px';
      cv.replaceWith(img);
    } else {
      // if empty, just remove the canvas area
      cv.replaceWith(document.createComment('signature-empty'));
    }
  });

  // 2) Prevent orphan headings: wrap heading and next block together
  const headings = clone.querySelectorAll('h1, h2, h3, h4, .section-title');
  headings.forEach(h => {
    const next = h.nextElementSibling;
    if (!next) return;
    // If already wrapped, skip
    if (h.parentElement && h.parentElement.classList.contains('avoid-break')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'avoid-break';
    h.parentElement.insertBefore(wrapper, h);
    wrapper.appendChild(h);
    // move the next block inside wrapper as well
    wrapper.appendChild(next);
  });

  // 3) Replace remaining controls with plain text (skip hidden and any marked for removal)
  const controls = clone.querySelectorAll('input, textarea, select');
  controls.forEach(el => {
    if (el.type === 'hidden' || el.getAttribute('data-remove') === 'true') { el.remove(); return; }
    const span = document.createElement(el.tagName === 'TEXTAREA' ? 'div' : 'span');
    // Plain text only (no borders), keep whitespace for multi-line
    span.style.whiteSpace = 'pre-wrap';
    span.style.background = 'transparent';
    span.style.display = (el.tagName === 'TEXTAREA') ? 'inline-block' : '';

    let text = '';
    const type = (el.getAttribute('type') || '').toLowerCase();
    if (el.tagName === 'SELECT') {
      const opt = el.selectedOptions && el.selectedOptions[0];
      text = opt ? (opt.text || opt.value || '') : '';
    } else if (el.tagName === 'TEXTAREA') {
      text = el.value || '';
    } else if (type === 'checkbox') {
      text = el.checked ? '✓' : '';
    } else if (type === 'radio') {
      if (el.checked) {
        text = el.value || '✓';
      } else {
        el.replaceWith(document.createComment('radio-omitted'));
        return;
      }
    } else if (type === 'date') {
      // Format ISO date (YYYY-MM-DD) to cs-CZ
      try {
        const d = el.value ? new Date(el.value) : null;
        text = d ? d.toLocaleDateString('cs-CZ') : '';
      } catch(_) { text = el.value || ''; }
    } else if (type === 'datetime-local') {
      try {
        text = el.value ? new Date(el.value).toLocaleString('cs-CZ') : '';
      } catch(_) { text = el.value || ''; }
    } else {
      text = el.value || '';
    }
    span.textContent = text;
    el.replaceWith(span);
  });
      clone.querySelectorAll('.sticky-actions').forEach(n => n.remove());
  return clone;
}

    function nodeControlDisplayValue(el){
      const tag = el.tagName;
      const type = (el.getAttribute && (el.getAttribute('type')||'').toLowerCase()) || '';
      if (tag === 'SELECT'){
        const opt = el.selectedOptions && el.selectedOptions[0];
        return opt ? (opt.text || opt.value || '') : '';
      }
      if (tag === 'TEXTAREA') return el.value || '';
      if (type === 'checkbox') return el.checked ? '✓' : '';
      if (type === 'radio') return el.checked ? (el.value || '✓') : '';
      if (type === 'date'){
        try { return el.value ? new Date(el.value).toLocaleDateString('cs-CZ') : ''; } catch(_) { return el.value || ''; }
      }
      if (type === 'datetime-local'){
        try { return el.value ? new Date(el.value).toLocaleString('cs-CZ') : ''; } catch(_) { return el.value || ''; }
      }
      return el.value || '';
    }

    function nodeToPlainText(node){
      let out = '';
      node.childNodes.forEach(ch => {
        if (ch.nodeType === Node.TEXT_NODE){ out += ch.textContent; return; }
        if (ch.nodeType === Node.ELEMENT_NODE){
          const tag = ch.tagName;
          if (tag === 'BR'){ out += '\n'; return; }
          if (['INPUT','SELECT','TEXTAREA'].includes(tag)) { out += nodeControlDisplayValue(ch); return; }
          // recurse
          out += nodeToPlainText(ch);
        }
      });
      return out;
    }

    function extractDocToPdfMake(){
      const body = [];
      const modalBody = document.querySelector('#formModal .modal .modal-body');
      if (!modalBody) return body;
      // Prefer explicit .doc blocks (embedded fulltext)
      const docs = modalBody.querySelectorAll('.doc');
      const blocks = docs.length ? docs : [modalBody];
      blocks.forEach(root => {
        root.querySelectorAll('h1,h2,h3,h4,p,ul,ol').forEach(el => {
          const tag = el.tagName.toLowerCase();
          if (tag === 'ul' || tag === 'ol'){
            const items = Array.from(el.querySelectorAll(':scope > li')).map(li => nodeToPlainText(li).trim());
            if (items.length){
              body.push({ ul: items, margin: [0, 0, 0, 6] });
            }
            return;
          }
          const text = nodeToPlainText(el).replace(/\s+$/,'');
          if (!text) return;
          if (tag === 'h1' || tag === 'h2' || tag === 'h3' || tag === 'h4'){
            body.push({ text, style: tag, margin: [0, (tag==='h1'?8:6), 0, 6] });
          } else { // paragraph
            body.push({ text, style: 'p', margin: [0, 0, 0, 4] });
          }
        });
      });
      // Signatures: append as images if present
      const sigCanvases = modalBody.querySelectorAll('canvas.signature-pad');
      sigCanvases.forEach(cv => {
        const id = cv.getAttribute('data-signature-id');
        const hidden = modalBody.querySelector(`#f_${id}`);
        const dataUrl = hidden && hidden.value ? hidden.value : '';
        if (dataUrl){ body.push({ image: dataUrl, width: 260, margin: [0, 10, 0, 10] }); }
      });
      return body;
    }
